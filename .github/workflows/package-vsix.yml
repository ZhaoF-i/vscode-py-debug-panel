name: Package VSIX

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    name: Build and package VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npm run package -- --out vscode-py-debug-panel.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-py-debug-panel-vsix
          path: vscode-py-debug-panel.vsix
          if-no-files-found: error
